[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nano_code"
version = "1.0.0"
description = "A minimal coding agent inspired by Claude Code, built from scratch in Python"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
sandbox = [
    "microsandbox>=0.5.4",
]

[project.scripts]
nano-code = "nano_code.__main__:main"

[tool.setuptools.packages.find]
include = ["nano_code*"]
