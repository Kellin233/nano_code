[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanocode"
version = "1.0.0"
description = "A minimal coding agent inspired by Claude Code, built from scratch in Python"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "prompt_toolkit>=3.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
sandbox = [
    "microsandbox>=0.5.4",
]

[project.scripts]
nanocode = "nanocode.cli.main:main"
nano-code = "nanocode.cli.main:main"

[tool.setuptools]
packages = [
    "nanocode",
    "nanocode.agent",
    "nanocode.agent.harness",
    "nanocode.agent.harness.context",
    "nanocode.agent.harness.hooks",
    "nanocode.agent.harness.permissions",
    "nanocode.agent.harness.persistence",
    "nanocode.cli",
    "nanocode.cli.core",
    "nanocode.cli.core.extensions",
    "nanocode.cli.core.mcp",
    "nanocode.cli.core.memory",
    "nanocode.cli.core.project",
    "nanocode.cli.core.protocol",
    "nanocode.cli.core.sandbox",
    "nanocode.cli.core.server",
    "nanocode.cli.core.server.transports",
    "nanocode.cli.core.skills",
    "nanocode.cli.core.subagents",
    "nanocode.cli.core.tools",
    "nanocode.providers",
    "nanocode.tui",
]
package-dir = {"nanocode" = "src"}

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["test/"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]
