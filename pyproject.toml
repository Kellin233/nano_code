[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanocode"
version = "1.0.0"
description = "A minimal coding agent inspired by Claude Code, built from scratch in Python"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "prompt_toolkit>=3.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
sandbox = [
    "microsandbox>=0.5.4",
]

[project.scripts]
nanocode = "nanocode.__main__:main"
nano-code = "nanocode.__main__:main"

[tool.setuptools]
packages = [
    "nanocode",
    "nanocode.capabilities",
    "nanocode.capabilities.hooks",
    "nanocode.capabilities.mcp",
    "nanocode.capabilities.memory",
    "nanocode.capabilities.skills",
    "nanocode.capabilities.subagents",
    "nanocode.capabilities.tools",
    "nanocode.core",
    "nanocode.domains",
    "nanocode.domains.context",
    "nanocode.domains.hooks",
    "nanocode.domains.mcp",
    "nanocode.domains.memory",
    "nanocode.domains.permissions",
    "nanocode.domains.sandbox",
    "nanocode.domains.skills",
    "nanocode.domains.subagents",
    "nanocode.domains.tools",
    "nanocode.protocol",
    "nanocode.providers",
    "nanocode.runtime",
    "nanocode.runtime.agent",
    "nanocode.sdk",
    "nanocode.server",
    "nanocode.server.transports",
    "nanocode.session",
    "nanocode.tui",
]
package-dir = {"nanocode" = "src"}
